<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f4f6f9;min-height:100vh;color:#1a1a2e}
/* HEADER */
.hdr{background:linear-gradient(135deg,#1a1a2e,#0f3460);padding:20px 32px;color:#fff;display:flex;align-items:center;gap:14px}
.hdr h1{font-size:19px;font-weight:600}
.hdr p{font-size:12px;opacity:.55;margin-top:2px}
/* HERO */
.hero{background:linear-gradient(135deg,#1a1a2e,#0f3460);padding:0 32px 32px;display:flex;justify-content:center}
/* SEARCH BAR */
.sbar{background:#fff;border-radius:56px;box-shadow:0 4px 24px rgba(0,0,0,.18);display:flex;align-items:center;width:100%;max-width:960px;margin-top:24px;padding:0 6px 0 0;gap:0}
.sep{width:1px;height:40px;background:#e0e0e0;flex-shrink:0}
/* CT toggle */
.ct-wrap{padding:10px 12px 10px 20px;flex-shrink:0}
.ct-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:#333;margin-bottom:5px}
.ct-row{display:flex;gap:5px}
.ct-btn{padding:5px 13px;border-radius:20px;border:1.5px solid #ddd;background:transparent;font-size:12px;font-weight:600;cursor:pointer;color:#888;transition:all .15s}
.ct-btn.on{background:#0f3460;border-color:#0f3460;color:#fff;box-shadow:0 2px 8px rgba(15,52,96,.35)}
/* AC fields */
.ac-wrap{position:relative;flex:1;min-width:0}
.ac-inner{padding:10px 16px;cursor:pointer;border-radius:56px;transition:background .15s}
.ac-inner:hover{background:#f5f5f5}
.ac-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:#333;margin-bottom:3px}
.ac-inp{width:100%;border:none;outline:none;background:transparent;font-size:13px;font-weight:600;color:#1a1a2e;padding:0}
.ac-inp::placeholder{color:#bbb;font-weight:400}
.ac-drop{position:absolute;top:calc(100% + 8px);left:0;min-width:230px;background:#fff;border-radius:14px;box-shadow:0 6px 28px rgba(0,0,0,.13);border:1px solid #eee;z-index:999;overflow:hidden;display:none;max-height:240px;overflow-y:auto}
.ac-item{padding:9px 14px;font-size:13px;cursor:pointer;border-bottom:.5px solid #f5f5f5;color:#1a1a2e;transition:background .1s}
.ac-item:hover{background:#eff6ff;color:#0f3460}
.ac-item:last-child{border-bottom:none}
/* Select fields */
.sel-wrap{position:relative;flex:1;min-width:0}
.sel-inner{padding:10px 16px;cursor:pointer;border-radius:56px;transition:background .15s}
.sel-inner:hover{background:#f5f5f5}
.sel-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:#333;margin-bottom:3px}
.sel-val{font-size:13px;color:#bbb;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel-val.on{color:#1a1a2e;font-weight:600}
.sel-drop{position:absolute;top:calc(100% + 8px);left:0;min-width:190px;background:#fff;border-radius:14px;box-shadow:0 6px 28px rgba(0,0,0,.13);border:1px solid #eee;z-index:999;overflow:hidden;display:none}
.sel-item{padding:9px 14px;font-size:13px;cursor:pointer;border-bottom:.5px solid #f5f5f5;color:#1a1a2e;transition:background .1s}
.sel-item:hover{background:#eff6ff;color:#0f3460}
.sel-item.on{background:#eff6ff;color:#0f3460;font-weight:700}
.sel-item:last-child{border-bottom:none}
/* Search btn */
.go-btn{width:48px;height:48px;border-radius:50%;background:#0f3460;border:none;color:#fff;font-size:17px;cursor:pointer;flex-shrink:0;margin:4px;transition:background .15s;display:flex;align-items:center;justify-content:center}
.go-btn:hover{background:#1a1a2e}
.clear-btn{width:36px;height:36px;border-radius:50%;background:transparent;border:1.5px solid #ddd;color:#999;font-size:13px;cursor:pointer;flex-shrink:0;margin:0 6px 0 0;transition:all .15s;display:none;align-items:center;justify-content:center;font-weight:700}
.clear-btn:hover{background:#fef2f2;border-color:#dc2626;color:#dc2626}
/* Results */
.main{padding:24px 32px;max-width:980px;margin:0 auto}
.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.cnt{font-size:13px;color:#6b7280;font-weight:500}
.sortrow{display:flex;gap:6px}
.sbtn{padding:4px 12px;border-radius:20px;border:1.5px solid #e5e7eb;background:transparent;font-size:12px;cursor:pointer;color:#6b7280;transition:all .15s}
.sbtn.on{background:#0f3460;border-color:#0f3460;color:#fff}
/* Cards */
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:#fff;border-radius:14px;border:1.5px solid #efefef;overflow:hidden;transition:box-shadow .15s,border-color .15s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08);border-color:#d0d0d0}
.card.best{border-color:#16a34a}
.best-lbl{background:#f0fdf4;padding:3px 16px;font-size:11px;font-weight:700;color:#16a34a;border-bottom:1px solid #dcfce7}
.cbody{padding:14px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.cleft{flex:1;min-width:0}
.crow{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.cdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cname{font-size:14px;font-weight:700}
.bdg{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500}
.bdg-a{background:#f3f4f6;color:#555}
.bdg-icd{background:#fef3c7;color:#92400e;font-weight:700}
.bdg-ok{background:#f0fdf4;color:#16a34a}
.bdg-soon{background:#fffbeb;color:#d97706}
.bdg-exp{background:#fef2f2;color:#dc2626}
.rrow{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.rport{font-size:11px;font-weight:600;color:#0f3460;background:#eff6ff;padding:3px 9px;border-radius:6px;border:1px solid #bfdbfe}
.rarr{font-size:13px;color:#9ca3af}
.drow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.info{font-size:11px;color:#9ca3af;margin-top:3px}
.cright{text-align:right;flex-shrink:0;min-width:145px}
.pm{font-size:22px;font-weight:700;color:#1a1a2e}
.pl{font-size:11px;color:#9ca3af;margin-top:2px}
.pa{margin-top:7px;padding-top:7px;border-top:1px solid #f3f4f6}
.pav{font-size:15px;font-weight:600;color:#6b7280}
.pal{font-size:11px;color:#c0c0c0}
.cfooter{padding:8px 18px 12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;border-top:1px solid #f5f5f5}
.rem-btn{background:none;border:none;cursor:pointer;font-size:11px;color:#9ca3af;padding:0}

.empty{text-align:center;padding:48px;color:#9ca3af;font-size:14px}
.hint{text-align:center;padding:52px;color:#9ca3af;font-size:13px}

<!-- PASSWORD -->
<script>
(function(){
  if(sessionStorage.getItem('fra')==='1') return;
  document.addEventListener('DOMContentLoaded', function(){
    var att = parseInt(sessionStorage.getItem('fat')||'0');
    function show(){
      var left = 5 - att;
      var locked = att >= 5;
      document.body.innerHTML =
        '<div style="font-family:Segoe UI,sans-serif;background:linear-gradient(135deg,#1a1a2e,#0f3460);min-height:100vh;display:flex;align-items:center;justify-content:center">'
       +'<div style="background:#fff;border-radius:16px;padding:40px 36px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center">'
       +'<div style="font-size:42px;margin-bottom:14px">🚢</div>'
       +'<div style="font-size:17px;font-weight:700;color:#1a1a2e;margin-bottom:6px">Freight Rates</div>'
       +'<div style="font-size:12px;color:#9ca3af;margin-bottom:22px">India &rarr; Brazil &middot; Acesso restrito</div>'
       +(locked
         ? '<div style="background:#fef2f2;border-radius:10px;padding:16px;color:#dc2626;font-size:13px;font-weight:600">🔒 Acesso bloqueado<br><span style="font-weight:400;font-size:12px">Feche o navegador e tente novamente.</span></div>'
         : '<input id="pw" type="password" placeholder="Digite a senha" style="width:100%;border:1.5px solid #e5e7eb;border-radius:10px;padding:11px 14px;font-size:14px;outline:none;color:#1a1a2e;margin-bottom:12px">'
          +'<button id="go" style="width:100%;background:#0f3460;color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer">Entrar</button>'
          +(att>0 ? '<div style="margin-top:10px;font-size:12px;color:#f59e0b">⚠️ '+left+' tentativa'+(left!==1?'s':'')+' restante'+(left!==1?'s':'')+'</div>' : '')
          +'<div id="err" style="margin-top:8px;font-size:12px;color:#dc2626;display:none">Senha incorreta.</div>'
       )
       +'</div></div>';
      if(!locked){
        var pw=document.getElementById('pw'), go=document.getElementById('go'), err=document.getElementById('err');
        pw.focus();
        function tryLogin(){
          if(pw.value==='SKY54321'){sessionStorage.setItem('fra','1');sessionStorage.removeItem('fat');location.reload();}
          else{att++;sessionStorage.setItem('fat',att);err.style.display='block';pw.value='';pw.style.borderColor='#dc2626';pw.focus();if(att>=5)show();}
        }
        go.addEventListener('click',tryLogin);
        pw.addEventListener('keydown',function(e){if(e.key==='Enter')tryLogin();});
      }
    }
    show();
  });
})();
</script>

// ── AC fields ───────────────────────────────────────────────────────
function initAC(field, opts){
  var inp=document.getElementById('inp-'+field);
  var drop=document.getElementById('dr-'+field);

  inp.addEventListener('focus',function(){
    renderAC(field,this.value,opts);
    drop.style.display='block';
  });
  inp.addEventListener('input',function(){
    renderAC(field,this.value,opts);
    drop.style.display='block';
  });
  inp.addEventListener('click',function(e){e.stopPropagation();});
  drop.addEventListener('click',function(e){e.stopPropagation();});
}

function renderAC(field,q,opts){
  var drop=document.getElementById('dr-'+field);
  var filtered=opts.filter(function(o){return o.toUpperCase().indexOf(q.toUpperCase().trim())>=0;}).slice(0,14);
  drop.innerHTML='';
  filtered.forEach(function(o){
    var el=document.createElement('div');
    el.className='ac-item';
    el.textContent=o;
    el.addEventListener('mousedown',function(e){
      e.preventDefault();
      document.getElementById('inp-'+field).value=o;
      if(field==='por') selPor=o; else selPod=o;
      drop.style.display='none';
    });
    drop.appendChild(el);
  });
}

function splitP(s){return s.split(/[\/,]/).map(function(x){return x.trim().toUpperCase();}).filter(Boolean);}
function pDate(s){if(!s)return null;var p=s.split('/');return p.length===3?new Date(+p[2],+p[1]-1,+p[0]):null;}
function vStat(v){var d=pDate(v);if(!d)return'ok';var n=new Date();if(d<n)return'exp';return(d-n)/864e5<=7?'soon':'ok';}
function fmt(v){return v?'USD '+v.toLocaleString('pt-BR'):'—';}
function setSort(s){srt=s;doSearch();}

    h+='<div class="drow"><span class="bdg '+vbc+'">'+vl+'</span><span style="font-size:11px;color:#9ca3af">'+r[9]+' → '+r[10]+'</span></div>';
    h+='<div class="info">Free Time: '+(ft||'—')+mblT+'</div>';
    h+='</div><div class="cright"><div class="pm">'+fmt(pM)+'</div><div class="pl">'+lM+'</div>'+(pA?'<div class="pa"><div class="pav">'+fmt(pA)+'</div><div class="pal">'+lA+'</div></div>':'')+'</div></div>';
    h+='<div class="cfooter">';
    h+=r[11]?'<button class="rem-btn" id="rb'+i+'">▼ observações</button>':'<span></span>';
    h+='<a href="'+schUrl+'" target="_blank" class="sch-a" style="color:'+col+';border-color:'+col+'">🗓 Schedule '+sh+'</a>';
    h+='</div>';
    if(r[11]) h+='<div class="rem-box" id="rb-box'+i+'">'+r[11]+'</div>';
    h+='</div></div>';
  });
  h+='</div>';
  area.innerHTML=h;

  // Attach sort button events
  var sbPr=document.getElementById('sb-pr');
  var sbVl=document.getElementById('sb-vl');
  if(sbPr) sbPr.addEventListener('click',function(){srt='price';doSearch();});
  if(sbVl) sbVl.addEventListener('click',function(){srt='validity';doSearch();});
  showClearBtn();

  // Attach rem buttons
  f.forEach(function(r,i){
    var rb=document.getElementById('rb'+i);
    if(rb) rb.addEventListener('click',function(){
      var box=document.getElementById('rb-box'+i);
      if(box){box.style.display=box.style.display==='block'?'none':'block';rb.textContent=(box.style.display==='block'?'▲':'▼')+' observações';}
    });
  });
}

// ── Clear all ────────────────────────────────────────────────────────
function clearAll(){
  // Reset inputs
  document.getElementById('inp-por').value='';
  document.getElementById('inp-pod').value='';
  selPor=''; selPod=''; selAg=''; selCars=[];
  // Reset carrier UI
  updateCarUI();
  // Reset agente
  document.getElementById('sv-ag').textContent='Todos';
  document.getElementById('sv-ag').className='sel-val';
  document.querySelectorAll('#sd-ag .sel-item').forEach(function(x){x.classList.remove('on');});
  var first=document.querySelector('#sd-ag .sel-item');
  if(first) first.classList.add('on');
  // Reset container
  setCT('20');
  // Clear results
  document.getElementById('results').innerHTML='<div class="hint">Selecione origem e destino, depois clique em 🔍</div>';
  // Hide clear button
  document.getElementById('clear-btn').style.display='none';
  closeDrops();
}

function showClearBtn(){
  var btn=document.getElementById('clear-btn');
  if(btn) btn.style.cssText='display:flex;width:36px;height:36px;border-radius:50%;background:transparent;border:1.5px solid #ddd;color:#999;font-size:13px;cursor:pointer;flex-shrink:0;margin:0 6px 0 0;transition:all .15s;align-items:center;justify-content:center;font-weight:700';
}

// ── Init ────────────────────────────────────────────────────────────
initAC('por', PORS);
initAC('pod', PODS);
</script>
