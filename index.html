<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Freight Rates · India → Brazil</title>
<!-- SheetJS: leitura do .xlsx no navegador -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f5f5f4;--surface:#ffffff;--surface-2:#f0f0ee;--line:#e2e2df;--line-strong:#cdcdc8;
  --text:#1c1c1a;--muted:#62625d;--faint:#97978f;
  --accent:#0b7a52;--accent-bg:#e7f3ed;--accent-line:#9fd1b9;
  --warn:#a85a00;--warn-bg:#fcf0dd;
  --focus:#3b82f6;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#141413;--surface:#1b1b1a;--surface-2:#222220;--line:#2e2e2b;--line-strong:#3d3d39;
    --text:#e9e9e5;--muted:#a3a39c;--faint:#74746e;
    --accent:#46c08b;--accent-bg:#14291f;--accent-line:#2b6a4d;
    --warn:#f0a648;--warn-bg:#33240f;
    --focus:#60a5fa;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text)}
body{font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
svg.i{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:-2px}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

/* Cabeçalho */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.hdr{display:flex;align-items:center;gap:16px;padding:10px 16px;flex-wrap:wrap}
.hdr h1{font-size:15px;font-weight:650;letter-spacing:-.1px;white-space:nowrap}
.hdr .sub{color:var(--muted);font-size:12px;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.hdr .sub b{color:var(--text);font-weight:600}
.hdr .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;cursor:pointer;font-size:12px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
#btnFilters{display:none}

/* Barra de filtros */
.fbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 12px;padding:8px 16px 10px;border-top:1px solid var(--line)}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.flbl{font-size:11px;color:var(--muted);font-weight:500}
.f input[type=number],.f input[type=date]{height:28px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);padding:0 8px;font-variant-numeric:tabular-nums}
.f input[type=number]{width:72px}
.f input#fQty{width:60px}
.seg{align-self:flex-start;display:inline-flex;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden;height:28px}
.seg button{border:0;background:var(--surface);padding:0 10px;cursor:pointer;font-size:12px;font-variant-numeric:tabular-nums}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed=true]{background:var(--text);color:var(--surface);font-weight:600}
.chk{flex-direction:row;align-items:center;gap:6px;height:28px;cursor:pointer;white-space:nowrap;font-size:12px}
.chk input{accent-color:var(--text)}
.lnk{border:0;background:none;color:var(--muted);cursor:pointer;height:28px;font-size:12px;text-decoration:underline;text-underline-offset:2px}
.lnk:hover{color:var(--text)}

/* Multi-select com busca */
.ms{position:relative}
.ms-btn{display:flex;align-items:center;gap:6px;height:28px;min-width:140px;max-width:220px;padding:0 8px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);cursor:pointer;text-align:left}
.ms-btn .v{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--faint)}
.ms-btn .v.on{color:var(--text);font-weight:600}
.ms-pop{position:absolute;top:calc(100% + 4px);left:0;z-index:30;width:260px;background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.ms-q{width:100%;height:32px;border:0;border-bottom:1px solid var(--line);padding:0 10px;background:transparent;outline:none}
.ms-list{max-height:280px;overflow:auto;padding:4px 0}
.ms-opt{display:flex;align-items:center;gap:8px;padding:5px 10px;cursor:pointer;user-select:none}
.ms-opt:hover,.ms-opt.hl{background:var(--surface-2)}
.ms-opt input{accent-color:var(--text);pointer-events:none}
.ms-opt .n{margin-left:auto;color:var(--faint);font-size:11px;font-variant-numeric:tabular-nums}
.ms-empty{padding:8px 10px;color:var(--faint)}
.ms-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:4px 6px 4px 10px;color:var(--faint);font-size:11px}

/* Área principal */
main{padding:12px 16px 32px}
.rbar{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;margin-bottom:8px;color:var(--muted);font-size:12px}
.rbar b{color:var(--text);font-variant-numeric:tabular-nums}
.rbar .sp{flex:1}
.msg{padding:28px 16px;border:1px dashed var(--line-strong);border-radius:4px;color:var(--muted);text-align:center;background:var(--surface)}
.msg .btn{margin-top:10px}
.drop.over{border-color:var(--text);background:var(--surface-2)}

/* Tabela */
.twrap{overflow:auto;border:1px solid var(--line);background:var(--surface);max-height:var(--twh,70vh)}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:5px 7px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);font-size:11px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line-strong);user-select:none}
thead th.s{cursor:pointer}
thead th.s:hover{color:var(--text)}
thead th .ar{display:inline-block;width:8px;color:var(--text)}
.num{text-align:right;font-variant-numeric:tabular-nums}
td.num{font-size:12.5px}
tbody tr.r{cursor:pointer}
tbody tr.r:hover td{background:var(--surface-2)}
tr.best td{background:var(--accent-bg)}
tr.best:hover td{background:var(--accent-bg)}
tr.best td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.best td.tot{color:var(--accent);font-weight:700}
tr.exp td{color:var(--faint)}
td.tot{font-weight:600}
.tag{display:inline-block;padding:0 5px;border-radius:3px;font-size:11px;line-height:17px;font-family:system-ui,sans-serif;font-weight:600}
.tag.best{background:var(--accent);color:var(--surface)}
.st{font-size:12px}
.st.soon{color:var(--warn);font-weight:600}
.st.soon::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-right:5px;vertical-align:1px}
.st.future,.st.tbc,.st.spot{color:var(--muted)}
.st.expired{color:var(--faint);text-decoration:line-through}
.dim{color:var(--faint)}
.flag{border-bottom:1px dotted currentColor;cursor:help}
.carr{font-weight:600}
/* Identificação do armador: logo (se houver arquivo em logos/) ou etiqueta colorida */
.cb{display:inline-flex;align-items:center;justify-content:center;min-width:78px;height:20px;padding:0 6px;border-radius:3px;background:var(--c);color:var(--t,#fff);font-size:11px;font-weight:700;letter-spacing:.3px}
.clogo{display:inline-flex;align-items:center;justify-content:center;width:78px;height:22px;padding:2px 4px;border-radius:3px;background:#fff;border:1px solid var(--line)}
.clogo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.obs{max-width:230px;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;border:1px solid var(--line-strong);border-radius:3px;padding:0 4px;margin-right:3px;font-size:11px;line-height:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.raw{color:var(--faint);font-style:italic}
.act{display:flex;gap:2px;justify-content:flex-end}
.ib{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:0;background:transparent;border-radius:3px;color:var(--muted);cursor:pointer;text-decoration:none}
.ib:hover{background:var(--line);color:var(--text)}
tr.det td{background:var(--surface-2);white-space:normal;padding:10px 12px 12px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px 24px}
.kv div{min-width:0}
.kv dt{font-size:11px;color:var(--muted);margin-bottom:1px}
.kv dd{word-break:break-word}

h2{font-size:13px;font-weight:650;margin:22px 0 8px;display:flex;gap:8px;align-items:baseline}
h2 .c{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.tbc td{color:var(--muted)}

/* Painel de qualidade */
details.dq{margin-top:22px;border:1px solid var(--line);background:var(--surface)}
details.dq>summary{cursor:pointer;padding:8px 12px;font-weight:600;list-style:none;display:flex;gap:8px;align-items:center}
details.dq>summary::-webkit-details-marker{display:none}
details.dq>summary svg{transition:transform .15s}
details.dq[open]>summary svg{transform:rotate(90deg)}
details.dq>summary .c{color:var(--muted);font-weight:400}
.dqb{padding:4px 12px 14px;border-top:1px solid var(--line)}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;padding:10px 0 4px}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--muted)}
.dqb h3{font-size:12px;font-weight:600;margin:16px 0 6px}
.dqb h3 .c{color:var(--muted);font-weight:400}
.dqb table{font-size:12px}
.dqb td,.dqb th{white-space:normal}
.dqb .none{color:var(--faint);font-size:12px}

.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:7px 14px;border-radius:4px;font-size:12px;z-index:50}

/* Telas estreitas: filtros recolhidos em painel */
@media (max-width:900px){
  #btnFilters{display:inline-flex}
  .fbar{display:none;flex-direction:column;align-items:stretch}
  .fbar.open{display:flex}
  .f{width:100%}
  .ms-btn{max-width:none;width:100%}
  .ms-pop{width:100%}
  .lnk{align-self:flex-start}
  .hdr{padding:10px 12px}
  .fbar,main{padding-left:12px;padding-right:12px}
}

/* Tela de senha */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:16px;font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}
.gate .box{width:320px;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:28px 24px}
.gate h1{font-size:15px;font-weight:650}
.gate p{color:var(--muted);font-size:12px;margin:2px 0 18px}
.gate input{width:100%;height:34px;border:1px solid var(--line-strong);border-radius:4px;padding:0 10px;background:var(--surface);margin-bottom:10px}
.gate button{width:100%;height:34px;border:0;border-radius:4px;background:var(--text);color:var(--surface);font-weight:600;cursor:pointer}
.gate .err{color:#c0392b;font-size:12px;margin-top:8px}
.gate .warn{color:var(--warn);font-size:12px;margin-top:8px}
.gate .lock{border:1px solid var(--line-strong);border-radius:4px;padding:12px;font-size:12px}
</style>
</head>
<body>

<!-- =====================================================================
     Acesso por senha — mesma lógica do site anterior (senha, 5 tentativas,
     chaves 'fra' e 'fat' no sessionStorage). Só o visual mudou: sem emojis.
     ===================================================================== -->
<script>
(function(){
  if(sessionStorage.getItem('fra')==='1') return;
  document.addEventListener('DOMContentLoaded', function(){
    var att = parseInt(sessionStorage.getItem('fat')||'0');
    function show(){
      var left = 5 - att;
      var locked = att >= 5;
      document.body.innerHTML =
        '<div class="gate"><div class="box">'
       +'<h1>Freight Rates</h1>'
       +'<p>India &rarr; Brazil &middot; Acesso restrito</p>'
       +(locked
         ? '<div class="lock"><b>Acesso bloqueado</b><br>Feche o navegador e tente novamente.</div>'
         : '<input id="pw" type="password" placeholder="Digite a senha">'
          +'<button id="go">Entrar</button>'
          +(att>0 ? '<div class="warn">'+left+' tentativa'+(left!==1?'s':'')+' restante'+(left!==1?'s':'')+'</div>' : '')
          +'<div id="err" class="err" style="display:none">Senha incorreta.</div>'
       )
       +'</div></div>';
      if(!locked){
        var pw=document.getElementById('pw'), go=document.getElementById('go'), err=document.getElementById('err');
        pw.focus();
        function tryLogin(){
          if(pw.value==='SKY54321'){sessionStorage.setItem('fra','1');sessionStorage.removeItem('fat');location.reload();}
          else{att++;sessionStorage.setItem('fat',att);err.style.display='block';pw.value='';pw.style.borderColor='#c0392b';pw.focus();if(att>=5)show();}
        }
        go.addEventListener('click',tryLogin);
        pw.addEventListener('keydown',function(e){if(e.key==='Enter')tryLogin();});
      }
    }
    show();
  });
})();
</script>

/* =========================================================================
   NORMALIZAÇÃO DOS DADOS
   Toda a limpeza acontece aqui, no carregamento. A planilha não muda.
   ========================================================================= */

/* Texto limpo: converte para string, troca espaço não separável e apara. */
function txt(v){ return v==null ? '' : String(v).replace(/\u00a0/g,' ').trim(); }

/* Remove acentos (PARANAGUÁ -> PARANAGUA). */
function noAccent(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

/* Porto: sem acento, caixa alta, espaços simples e grafia corrigida pelo PORT_ALIASES. */
function normPort(p){
  var s = noAccent(txt(p)).toUpperCase().replace(/\s+/g,' ').replace(/[.;]+$/,'').trim();
  var key = s.replace(/\s/g,'');
  if(PORT_ALIASES[s]) return PORT_ALIASES[s];
  if(PORT_ALIASES[key]) return PORT_ALIASES[key];
  return s;
}

/* Célula com vários portos ("SANTOS / PARANAGUA/RIO GRANDE"): separa por "/"
   (com ou sem espaço) ou vírgula, normaliza cada um e remove repetidos. */
function splitPorts(v){
  var out = [];
  txt(v).split(/\s*[\/,]\s*/).forEach(function(p){
    var n = normPort(p);
    if(n && out.indexOf(n) < 0) out.push(n);
  });
  return out;
}

/* Número em texto livre. Aceita 5500, "5.500", "USD 60", "41,7142857", "1,234.50".
   Retorna {v, kind, raw}. kind: 'num' | 'tbc' | 'incl' | 'empty' | 'invalid'.
   "TBC" vira nulo (sob consulta), nunca zero. */
function parseNum(v){
  if(typeof v === 'number') return isFinite(v) ? {v:v, kind:'num', raw:v} : {v:null, kind:'invalid', raw:v};
  var s = noAccent(txt(v)).toUpperCase();
  if(!s) return {v:null, kind:'empty', raw:''};
  if(/\bTBC\b|TO BE CONFIRM|A CONFIRMAR|SOB CONSULTA|\bTBA\b/.test(s)) return {v:null, kind:'tbc', raw:v};
  if(/^INCL/.test(s)) return {v:0, kind:'incl', raw:v};
  var n = numFromString(s.replace(/U\s?S\s?D|US\$|\$/g,'').replace(/\s+/g,''));
  return n == null ? {v:null, kind:'invalid', raw:v} : {v:n, kind:'num', raw:v};
}
/* Decide qual é o separador decimal:
   - "1.234,56" / "1,234.56": o último separador é o decimal;
   - só vírgula: "41,71" é decimal; "1,500" (grupos de 3) é milhar;
   - só ponto:  "5.500" (grupos de 3) é milhar; "41.71" é decimal. */
function numFromString(s){
  if(!/^-?[\d.,]+$/.test(s) || !/\d/.test(s)) return null;
  var hasC = s.indexOf(',') >= 0, hasD = s.indexOf('.') >= 0;
  if(hasC && hasD){
    s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  } else if(hasC){
    s = /^-?\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g,'') : s.replace(',','.');
  } else if(hasD){
    if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  }
  var n = parseFloat(s);
  return isFinite(n) ? n : null;
}

/* MBL FEE: número, "USD 60", "INCLUDED" (= 0, exibido como "incluso") ou valor
   quebrado (41,7142857 -> 41,71, marcado como arredondado). */
function parseMbl(v){
  var r = parseNum(v);
  r.rounded = false;
  if(r.kind === 'num'){
    var x = Math.round(r.v * 100) / 100;
    if(Math.abs(x - r.v) > 1e-9){ r.rounded = true; r.orig = r.v; }
    r.v = x;
  }
  return r;
}

/* FREE DAYS / TTIME: extrai o primeiro número ("21 DAYS", "21-DAYS" -> 21). */
function parseDays(v){
  if(typeof v === 'number') return {v:Math.round(v), kind:'num', raw:v};
  var s = noAccent(txt(v)).toUpperCase();
  if(!s) return {v:null, kind:'empty', raw:''};
  if(/\bTBC\b|A CONFIRMAR/.test(s)) return {v:null, kind:'tbc', raw:v};
  var m = s.match(/(\d+)/);
  return m ? {v:parseInt(m[1],10), kind:'num', raw:v} : {v:null, kind:'invalid', raw:v};
}

/* Data: número serial do Excel (46327 = 01/11/2026), texto dd/mm/aaaa,
   dd/mm/aa, dd.mm.aaaa ou aaaa-mm-dd. "TBC" vira nulo (sob consulta).
   As datas ficam em meia-noite local, para comparação por dia. */
function parseDate(v){
  if(typeof v === 'number'){
    if(v > 20000 && v < 90000) return {d:new Date(1899, 11, 30 + Math.floor(v)), kind:'date', raw:v};
    return {d:null, kind:'invalid', raw:v};
  }
  if(v instanceof Date && !isNaN(v)) return {d:new Date(v.getFullYear(), v.getMonth(), v.getDate()), kind:'date', raw:v};
  var s = txt(v).toUpperCase();
  if(!s) return {d:null, kind:'empty', raw:''};
  if(/\bTBC\b|A CONFIRMAR/.test(s)) return {d:null, kind:'tbc', raw:v};
  if(/\bSPOT\b/.test(s)) return {d:null, kind:'spot', raw:v};   // tarifa spot: sem validade fixa
  var m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/), d = null;
  if(m){ var y = +m[3]; if(y < 100) y += 2000; d = mkDate(y, +m[2], +m[1]); }
  else if((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) d = mkDate(+m[1], +m[2], +m[3]);
  else if(/^\d{5}$/.test(s)) return parseDate(+s);
  return d ? {d:d, kind:'date', raw:v} : {d:null, kind:'invalid', raw:v};
}
function mkDate(y, mo, da){
  var d = new Date(y, mo - 1, da);
  return (d.getFullYear() === y && d.getMonth() === mo - 1 && d.getDate() === da) ? d : null;
}

/* Sobretaxas escritas em texto livre (REMARKS + CANCELLATION FEE).
   Extrai o que for reconhecível; o texto original continua sempre visível.
   status: 'empty' (nada escrito) | 'ok' | 'partial' (parte não reconhecida) | 'none' (nada extraído) */
function amt(s){ var n = numFromString(String(s).replace(/[.,]$/,'')); return n; }
function weight(s){ var n = parseFloat(String(s).replace(',','.')); return isFinite(n) ? n : null; }

function parseSurcharges(remarks, cancelCol){
  var out = {ows:null, ens:null, isps:null, cancel:null, amend:null, issues:[], status:'empty'};
  var T = noAccent(txt(remarks)).toUpperCase().replace(/U\s+SD/g,'USD').replace(/\s+/g,' ');
  var C = noAccent(txt(cancelCol)).toUpperCase().replace(/U\s+SD/g,'USD').replace(/\s+/g,' ');
  if(!T && !C) return out;
  var found = 0;

  /* OWS (overweight surcharge). Trecho começa em "OWS" e vai até ENS/ISPS/CANCEL/AMEND.
     Formatos reconhecidos:
       "OWS: USD 200 above 18MT/20'GP"
       "Ows of U sd 200/20 for Cargo weight more than 18-Mts"
       "OWS APPLICABLE $400 PER 20DC FOR VGM EXCEEDING 20 TONS"
       "OWS: Between 18.001 and 23MT= usd125/20', Between 23.001 and Above= usd250/20'" (faixas) */
  var oi = T.search(/\bOWS\b/);
  if(oi >= 0){
    var seg = T.slice(oi);
    var cut = seg.slice(3).search(/\b(ENS|ISPS|CANCEL\w*|AMEND\w*)\b/);
    if(cut >= 0) seg = seg.slice(0, cut + 3);
    var unitM = seg.match(/(?:PER|\/)\s*(20|40)\s*'?\s*(?:DC|GP|DV|HC|HQ)?/);
    var per = unitM ? unitM[1] : null;
    var tiers = [], re = /BETWEEN\s*([\d.,]+)\s*(?:MTS?|TONS?)?\s*AND\s*(ABOVE|[\d.,]+)\s*(?:MTS?|TONS?)?\s*=?\s*(?:USD|\$)?\s*([\d.,]+)/g, tm;
    while((tm = re.exec(seg))) tiers.push({from:weight(tm[1]), to:tm[2]==='ABOVE'?null:weight(tm[2]), usd:amt(tm[3])});
    if(!tiers.length){
      var a = seg.match(/(?:USD|\$)\s*([\d.,]+)/) || seg.match(/\bOWS\b[\s:\-]*(?:OF\b)?[\s:\-]*(?:APPLICABLE\b)?[\s:\-]*([\d.,]+)(?!\s*-?\s*(?:MTS?|TONS?)\b)/);
      var w = seg.match(/(?:ABOVE|MORE THAN|EXCEEDING|OVER|ACIMA DE|>)\s*([\d.,]+)\s*-?\s*(?:MTS?|TONS?|T\b)/);
      if(a && amt(a[1]) != null){
        tiers.push({from:w ? weight(w[1]) : null, to:null, usd:amt(a[1])});
        if(!w) out.issues.push('OWS sem limite de peso');
      }
    }
    if(tiers.length){ out.ows = {tiers:tiers, per:per}; found++; }
    else out.issues.push('OWS não reconhecido');
  }

  /* ENS por BL: "ENS $30 PER BL", "ENS USD 30/BL". */
  if(/\bENS\b/.test(T)){
    var e = T.match(/\bENS\b[^$\d]{0,20}(?:USD|\$)?\s*([\d.,]+)/);
    if(e && amt(e[1]) != null){ out.ens = amt(e[1]); found++; } else out.issues.push('ENS não reconhecido');
  }
  /* ISPS por container: "ISPS $14 PER CONTAINER". */
  if(/\bISPS\b/.test(T)){
    var p = T.match(/\bISPS\b[^$\d]{0,20}(?:USD|\$)?\s*([\d.,]+)/);
    if(p && amt(p[1]) != null){ out.isps = amt(p[1]); found++; } else out.issues.push('ISPS não reconhecido');
  }

  /* Cancelamento e alteração (amendment), por container.
     Na coluna CANCELLATION FEE, um valor sem a palavra "cancel" é o próprio cancelamento. */
  function grab(src, word){
    var m = src.match(new RegExp(word + '\\w*[^$\\d]{0,30}(?:USD|\\$)?\\s*([\\d.,]+)'));
    return m ? amt(m[1]) : null;
  }
  [T, C].forEach(function(src, isCol){
    if(!src) return;
    if(/AMEND/.test(src)){
      var am = grab(src, 'AMEND');
      if(am != null){ if(out.amend == null){ out.amend = am; found++; } }
      else out.issues.push('Alteração não reconhecida');
    }
    if(/CANCEL/.test(src)){
      var cn = grab(src, 'CANCEL');
      if(cn != null){ if(out.cancel == null){ out.cancel = cn; found++; } }
      else out.issues.push('Cancelamento não reconhecido');
    } else if(isCol){
      /* Coluna de cancelamento sem a palavra: primeiro valor fora do trecho de amendment. */
      var rest = src.replace(/AMEND.*$/, '');
      if(/\bTBC\b/.test(rest)) { out.issues.push('Cancelamento TBC'); }
      else if(/\bNIL\b|\bNONE\b|^N\/?A$|^-$/.test(rest)) { /* sem cobrança */ }
      else {
        var m = rest.match(/(?:USD|\$)?\s*(\d[\d.,]*)/);
        if(m && amt(m[1]) != null){ if(out.cancel == null){ out.cancel = amt(m[1]); found++; } }
        else if(rest.trim()) out.issues.push('Cancelamento não reconhecido');
      }
    }
  });

  out.status = !found ? 'none' : (out.issues.length ? 'partial' : 'ok');
  return out;
}

/* Células mescladas: o Excel guarda o valor só na primeira célula.
   Copia esse valor para as demais células da mesclagem. */
function fillMerges(ws){
  (ws['!merges'] || []).forEach(function(m){
    var tl = ws[XLSX.utils.encode_cell(m.s)];
    if(!tl) return;
    for(var r = m.s.r; r <= m.e.r; r++) for(var c = m.s.c; c <= m.e.c; c++){
      if(r === m.s.r && c === m.s.c) continue;
      ws[XLSX.utils.encode_cell({r:r, c:c})] = {t:tl.t, v:tl.v, w:tl.w};
    }
  });
}

/* Identifica as colunas pelo texto do cabeçalho (não pela posição),
   para tolerar uma coluna a mais ou fora de ordem. */
var COLS = [
  ['carrier', /^CARRIER/], ['agent', /^AGENT/], ['por', /^POR$|^POR[^T]/], ['pol', /^POL$|^POL[^I]/],
  ['pod', /^POD/], ['f20', /^FREIGHT20|^FRETE20/], ['f40', /^FREIGHT40|^FRETE40/], ['mbl', /^MBL/],
  ['free', /^FREEDAYS|^FREETIME/], ['from', /^VALIDFROM|^VALIDADEDE/], ['until', /^VALIDUNTIL|^VALIDTO|^VALIDADEATE/],
  ['tt', /^TTIME|^TRANSIT|^TT$/], ['remarks', /^REMARK|^OBS/], ['cancel', /^CANCEL/]
];
function headerMap(row){
  var map = {}, hits = 0;
  row.forEach(function(cell, i){
    var k = noAccent(txt(cell)).toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(!k) return;
    for(var j = 0; j < COLS.length; j++){
      if(map[COLS[j][0]] == null && COLS[j][1].test(k)){ map[COLS[j][0]] = i; hits++; break; }
    }
  });
  return hits >= 6 && map.carrier != null && map.pod != null ? map : null;
}

/* Data de atualização (linha 4, "ATUALIZADO 30/10"). Aceita o texto com a data,
   a data na célula ao lado, ou célula de data formatada como "ATUALIZADO dd/mm".
   Sem ano: usa o ano atual (ou o anterior, se a data cair muito no futuro). */
function findUpdate(ws, maxRow){
  var rng = XLSX.utils.decode_range(ws['!ref']);
  for(var r = rng.s.r; r <= Math.min(maxRow, rng.e.r); r++){
    for(var c = rng.s.c; c <= rng.e.c; c++){
      var cell = ws[XLSX.utils.encode_cell({r:r, c:c})];
      if(!cell) continue;
      var shown = noAccent(String(cell.w != null ? cell.w : cell.v)).toUpperCase();
      if(!/ATUALIZ/.test(shown)) continue;
      if(cell.t === 'n') return parseDate(cell.v).d;
      var m = shown.match(/(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?/);
      if(!m){
        for(var c2 = c + 1; c2 <= rng.e.c; c2++){
          var nx = ws[XLSX.utils.encode_cell({r:r, c:c2})];
          if(!nx || txt(nx.v) === '') continue;
          if(nx.t === 'n') return parseDate(nx.v).d;
          m = String(nx.w || nx.v).match(/(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?/);
          break;
        }
      }
      if(m){
        var y = m[3] ? +m[3] : null; if(y && y < 100) y += 2000;
        var t = today();
        if(!y){ y = t.getFullYear(); var d0 = mkDate(y, +m[2], +m[1]); if(d0 && d0 - t > 60*864e5) y--; }
        return mkDate(y, +m[2], +m[1]);
      }
    }
  }
  return null;
}

/* Processa o arquivo inteiro e devolve a base normalizada + relatório de qualidade.
   Lê toda aba cujo cabeçalho tenha as colunas esperadas (a aba INDIA primeiro). */
function processWorkbook(wb){
  var Q = {rawRows:0, dupes:[], src:[], issues:[], rounded:[], remarksBad:[], outliers:[], sheets:[]};
  var updated = null, seen = {}, srcs = [], rows = [];
  var names = wb.SheetNames.slice().sort(function(a,b){ return (b.toUpperCase()==='INDIA') - (a.toUpperCase()==='INDIA'); });

  names.forEach(function(name){
    var ws = wb.Sheets[name];
    if(!ws || !ws['!ref']) return;
    fillMerges(ws);
    var r0 = XLSX.utils.decode_range(ws['!ref']).s.r;
    var aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:'', blankrows:true});
    /* Cabeçalho: primeiro tenta a linha configurada; se não bater, procura nas 25 primeiras. */
    var hIdx = CONFIG.HEADER_ROW - 1 - r0, map = aoa[hIdx] ? headerMap(aoa[hIdx]) : null;
    if(!map){ for(var i = 0; i < Math.min(25, aoa.length); i++){ map = headerMap(aoa[i]); if(map){ hIdx = i; break; } } }
    if(!map) return;
    Q.sheets.push(name);
    if(!updated) updated = findUpdate(ws, r0 + hIdx);

    for(var k = hIdx + 1; k < aoa.length; k++){
      var row = aoa[k], rowNum = r0 + k + 1;
      var g = function(f){ return map[f] == null ? '' : row[map[f]]; };
      var cells = ['carrier','agent','por','pol','pod','f20','f40','mbl','free','from','until','tt','remarks','cancel'].map(g);
      if(cells.every(function(x){ return txt(x) === ''; })) continue;           // linha vazia
      if(!txt(g('por')) && !txt(g('pod')) && !txt(g('f20')) && !txt(g('f40'))) continue; // título/nota solta
      Q.rawRows++;

      /* Duplicada exata: mesmos valores em todas as colunas da base. Mantém a primeira. */
      var key = JSON.stringify(cells.map(function(x){ return typeof x === 'number' ? x : txt(x).toUpperCase().replace(/\s+/g,' '); }));
      if(seen[key]){ Q.dupes.push({sheet:name, row:rowNum, of:seen[key]}); continue; }
      seen[key] = name + ' ' + rowNum;

      var s = {
        id: srcs.length, sheet:name, row:rowNum,
        carrier: noAccent(txt(g('carrier'))).toUpperCase().replace(/\s+/g,' '),
        agent: noAccent(txt(g('agent'))).toUpperCase().replace(/\s+/g,' '),
        porList: splitPorts(g('por')), polList: splitPorts(g('pol')), podList: splitPorts(g('pod')),
        polRaw: txt(g('pol')),
        f20: parseNum(g('f20')), f40: parseNum(g('f40')),
        mbl: parseMbl(g('mbl')), free: parseDays(g('free')), tt: parseDays(g('tt')),
        from: parseDate(g('from')), until: parseDate(g('until')),
        remarks: txt(g('remarks')), cancelRaw: txt(g('cancel'))
      };
      s.carrierShort = carrierInfo(s.carrier).label;
      s.sur = parseSurcharges(s.remarks, s.cancelRaw);

      /* Problemas que impedem ou prejudicam a leitura da linha. */
      var iss = [];
      if(!s.carrier) iss.push('sem carrier');
      if(!s.porList.length) iss.push('sem POR');
      if(!s.podList.length) iss.push('sem POD');
      if(s.f20.kind === 'invalid') iss.push("frete 20' ilegível: \"" + txt(s.f20.raw) + '"');
      if(s.f40.kind === 'invalid') iss.push("frete 40'HC ilegível: \"" + txt(s.f40.raw) + '"');
      if(s.mbl.kind === 'invalid') iss.push('MBL ilegível: "' + txt(s.mbl.raw) + '"');
      if(s.free.kind === 'invalid') iss.push('free days ilegível: "' + txt(s.free.raw) + '"');
      if(s.from.kind === 'invalid') iss.push('valid from ilegível: "' + txt(s.from.raw) + '"');
      if(s.until.kind === 'invalid') iss.push('valid until ilegível: "' + txt(s.until.raw) + '"');
      if(s.from.d && s.until.d && s.until.d < s.from.d) iss.push('valid until antes de valid from');
      if(iss.length) Q.issues.push({s:s, list:iss});
      if(s.mbl.rounded) Q.rounded.push(s);
      if(s.sur.status === 'none' || s.sur.status === 'partial') Q.remarksBad.push(s);
      srcs.push(s);

      /* Explode em uma linha por combinação POR x POD, mantendo o vínculo (src).
         POL: se a lista de POL tem o mesmo tamanho da de POR, pareia pela posição;
         se tem um porto só, usa ele; senão mantém o texto original. */
      s.porList.forEach(function(por, pi){
        var pol = s.polList.length === s.porList.length ? s.polList[pi] : (s.polList.length === 1 ? s.polList[0] : s.polRaw);
        s.podList.forEach(function(pod){ rows.push({id:rows.length, src:s, por:por, pol:pol, pod:pod}); });
      });
    }
  });

  /* Outliers: frete acima de 1,5x a mediana da mesma rota (POR x POD) e container. */
  ['20','40'].forEach(function(ct){
    var groups = {};
    rows.forEach(function(r){ var f = r.src['f'+ct]; if(f.kind === 'num'){ (groups[r.por+'|'+r.pod] = groups[r.por+'|'+r.pod] || []).push(r); } });
    var hit = {};
    Object.keys(groups).forEach(function(k){
      var vals = groups[k].map(function(r){ return r.src['f'+ct].v; }).sort(function(a,b){ return a-b; });
      var n = vals.length, med = n % 2 ? vals[(n-1)/2] : (vals[n/2-1] + vals[n/2]) / 2;
      groups[k].forEach(function(r){
        var v = r.src['f'+ct].v;
        if(n > 1 && v > CONFIG.OUTLIER_FACTOR * med){
          var hk = r.src.id + '|' + ct;
          if(!hit[hk]){ hit[hk] = {s:r.src, ct:ct, v:v, routes:[]}; Q.outliers.push(hit[hk]); }
          hit[hk].routes.push({por:r.por, pod:r.pod, med:med, n:n});
          r['out'+ct] = med;
        }
      });
    });
  });

  Q.src = srcs;
  return {rows:rows, srcs:srcs, Q:Q, updated:updated, hasTT:srcs.some(function(s){ return s.tt.kind === 'num'; })};
}

/* =========================================================================
   ESTADO, CÁLCULOS E FILTROS
   ========================================================================= */
var DB = null, SOURCE = '';
var F = {ct:'20', qty:1, por:[], pod:[], car:[], ag:[], ship:null, freeMin:null, ttMax:null, priced:true, expired:false};
var SORT = {key:'total', dir:1};
var OPEN = {};
var VIEW = {priced:[], tbc:[]};

function today(){ var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function refDate(){ return F.ship || today(); }
function dayDiff(a, b){ return Math.round((b - a) / 864e5); }
function plural(n, s){ return n + ' ' + s + (n === 1 ? '' : 's'); }

/* Status de validade contra hoje ou contra a data de embarque escolhida. */
function validity(s, ref){
  var f = s.from.d, u = s.until.d;
  /* SPOT: tarifa spot, sem período fixo. Conta como disponível e entra no ranking. */
  if(!f && !u && (s.from.kind === 'spot' || s.until.kind === 'spot')) return {k:'spot', label:'spot, confirmar no booking', ord:0};
  if(!f && !u) return {k:'tbc', label:'validade a confirmar', ord:4};
  if(f && ref < f) return {k:'future', label:'futura, começa em ' + plural(dayDiff(ref, f), 'dia'), ord:2};
  if(u && ref > u) return {k:'expired', label:'vencida', ord:5};
  if(u){
    var n = dayDiff(ref, u);
    if(n <= CONFIG.SOON_DAYS) return {k:'soon', label: n === 0 ? 'vence hoje' : 'vence em ' + plural(n, 'dia'), ord:1};
    return {k:'valid', label:'vigente', ord:0};
  }
  return {k:'valid', label:'vigente, fim a confirmar', ord:0};
}

/* Custo total da linha:
   qtd x frete + MBL (por BL) + ENS (por BL) + ISPS x qtd.
   OWS, cancelamento e alteração ficam só como observação. */
function cost(r){
  var s = r.src, f = s['f' + F.ct];
  if(f.kind !== 'num') return null;
  var q = F.qty, mbl = s.mbl.v || 0, ens = s.sur.ens || 0, isps = s.sur.isps || 0;
  return {freight:f.v, mbl:mbl, ens:ens, isps:isps, total: q * f.v + mbl + ens + isps * q};
}

function matchSel(list, v){ return !list.length || list.indexOf(v) >= 0; }

function applyFilters(){
  var ref = refDate(), priced = [], tbc = [], hiddenExp = 0;
  DB.rows.forEach(function(r){
    var s = r.src;
    if(!matchSel(F.por, r.por) || !matchSel(F.pod, r.pod) || !matchSel(F.car, s.carrier) || !matchSel(F.ag, s.agent)) return;
    if(F.freeMin != null && !(s.free.v != null && s.free.v >= F.freeMin)) return;
    if(DB.hasTT && F.ttMax != null && !(s.tt.v != null && s.tt.v <= F.ttMax)) return;
    r.val = validity(s, ref);
    if(r.val.k === 'expired' && !F.expired){ hiddenExp++; return; }
    r.c = cost(r);
    if(r.c) priced.push(r); else tbc.push(r);
  });

  /* Melhor opção de cada par POR x POD (entre as não vencidas) e diferença para ela. */
  var best = {};
  priced.forEach(function(r){
    if(r.val.k === 'expired') return;
    var k = r.por + '|' + r.pod;
    if(best[k] == null || r.c.total < best[k]) best[k] = r.c.total;
  });
  priced.forEach(function(r){
    var b = best[r.por + '|' + r.pod];
    r.isBest = r.val.k !== 'expired' && b != null && Math.abs(r.c.total - b) < 1e-9;
    r.diff = b == null ? null : r.c.total - b;
    r.diffPct = b ? (r.c.total - b) / b * 100 : null;
  });
  priced.sort(sorter());
  tbc.sort(function(a,b){ return cmp(a.src.carrierShort, b.src.carrierShort) || cmp(a.src.agent, b.src.agent) || cmp(a.por, b.por) || cmp(a.pod, b.pod); });
  VIEW = {priced:priced, tbc:tbc, hiddenExp:hiddenExp, pairs:Object.keys(best).length};
}

function cmp(a, b){ return a < b ? -1 : a > b ? 1 : 0; }
var SORT_KEYS = {
  carrier:function(r){ return r.src.carrierShort; }, agent:function(r){ return r.src.agent; },
  por:function(r){ return r.por; }, pod:function(r){ return r.pod; },
  freight:function(r){ return r.c.freight; },
  mbl:function(r){ return r.c.mbl; }, total:function(r){ return r.c.total; },
  diff:function(r){ return r.diff; }, free:function(r){ return r.src.free.v == null ? -1 : r.src.free.v; },
  tt:function(r){ return r.src.tt.v == null ? 1e9 : r.src.tt.v; },
  until:function(r){ return r.src.until.d ? +r.src.until.d : 9e15; }, status:function(r){ return r.val.ord; }
};
function sorter(){
  var fn = SORT_KEYS[SORT.key] || SORT_KEYS.total, d = SORT.dir;
  return function(a, b){ return d * cmp(fn(a), fn(b)) || cmp(a.c.total, b.c.total) || cmp(a.src.carrierShort, b.src.carrierShort); };
}

/* =========================================================================
   FORMATAÇÃO
   ========================================================================= */
var NF0 = new Intl.NumberFormat('pt-BR', {maximumFractionDigits:0});
var NF2 = new Intl.NumberFormat('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
var NF1 = new Intl.NumberFormat('pt-BR', {maximumFractionDigits:1});
function money(v){ return v == null ? '—' : (Math.abs(v % 1) > 1e-9 ? NF2 : NF0).format(v); }
function pct(v){ return (v > 0 ? '+' : '') + NF1.format(v) + '%'; }
function d2(d){ return d ? ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth()+1)).slice(-2) + '/' + d.getFullYear() : ''; }
function dShort(d){ return d ? ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth()+1)).slice(-2) : ''; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function ctLabel(ct){ return ct === '20' ? "20'" : "40'HC"; }

function fmtDateCell(p){
  if(p.d) return d2(p.d);
  if(p.kind === 'tbc') return 'TBC';
  if(p.kind === 'spot') return 'SPOT';
  if(p.kind === 'invalid') return txt(p.raw);
  return '';
}
function validityText(s){
  var f = s.from, u = s.until;
  if(f.kind === 'spot' && u.kind === 'spot') return 'SPOT';
  if(f.d && u.d && f.d.getFullYear() === u.d.getFullYear()) return dShort(f.d) + ' → ' + d2(u.d);
  return (fmtDateCell(f) || '?') + ' → ' + (fmtDateCell(u) || '?');
}
function mblCell(m){
  if(m.kind === 'incl') return 'incluso';
  if(m.kind === 'tbc') return 'TBC';
  if(m.kind === 'empty') return '—';
  if(m.kind === 'invalid') return '<span class="flag" title="Valor não interpretado">' + esc(txt(m.raw)) + '</span>';
  if(m.rounded) return '<span class="flag" title="Arredondado de ' + esc(String(m.orig).replace('.', ',')) + '">≈ ' + money(m.v) + '</span>';
  return money(m.v);
}
function owsText(o){
  var u = o.per ? "/" + o.per + "'" : '';
  return o.tiers.map(function(t){
    var w = t.from == null ? '' : (t.to == null ? ' >' + NF1.format(Math.floor(t.from)) + 't' : ' ' + NF1.format(Math.floor(t.from)) + '–' + NF1.format(t.to) + 't');
    return money(t.usd) + w;
  }).join(', ') + u;
}
function surChips(s){
  var x = s.sur, h = '';
  if(x.ows) h += '<span class="chip" title="Overweight surcharge (fora do total)">OWS ' + esc(owsText(x.ows)) + '</span>';
  if(x.cancel != null) h += '<span class="chip" title="Cancelamento por container (fora do total)">Canc. ' + money(x.cancel) + '</span>';
  if(x.amend != null) h += '<span class="chip" title="Alteração por container (fora do total)">Alter. ' + money(x.amend) + '</span>';
  var raw = [s.remarks, s.cancelRaw && !/CANCEL/i.test(s.cancelRaw) ? 'Cancellation: ' + s.cancelRaw : s.cancelRaw].filter(Boolean).join(' · ');
  if(x.status === 'none' || x.status === 'partial') h += '<span class="raw" title="' + esc(raw) + '">' + esc(raw) + '</span>';
  return h;
}

/* =========================================================================
   RENDERIZAÇÃO
   ========================================================================= */
function render(){
  if(!DB) return;
  applyFilters();
  var ref = refDate(), V = VIEW, tt = DB.hasTT, ctl = ctLabel(F.ct);

  document.getElementById('rbar').hidden = false;
  document.getElementById('rInfo').innerHTML =
    '<b>' + V.priced.length + '</b> ' + (V.priced.length === 1 ? 'tarifa' : 'tarifas') + ' · <b>' + V.pairs + '</b> ' + (V.pairs === 1 ? 'rota' : 'rotas') +
    (V.tbc.length ? ' · <b>' + V.tbc.length + '</b> sob consulta' + (F.priced ? ' (ocultas)' : '') : '') +
    (V.hiddenExp ? ' · <b>' + V.hiddenExp + '</b> vencidas ocultas' : '') +
    ' · referência: ' + (F.ship ? 'embarque ' + d2(F.ship) : 'hoje ' + d2(ref));

  var res = document.getElementById('results');
  if(!V.priced.length){
    res.innerHTML = '<div class="msg">Nenhuma tarifa com valor para os filtros escolhidos.' + (V.tbc.length && F.priced ? ' Há ' + V.tbc.length + ' sob consulta: desligue "Apenas com tarifa" para ver.' : '') + (V.hiddenExp ? ' ' + V.hiddenExp + ' vencidas estão ocultas.' : '') + '</div>';
  } else {
    var cols = [
      ['carrier','Carrier'], ['agent','Agente'], ['por','POR'], ['pod','POD'],
      ['freight','Frete ' + ctl, 1], ['mbl','MBL', 1], ['ens','ENS', 1, true], ['isps','ISPS', 1, true],
      ['total', 'Total' + (F.qty > 1 ? ' (' + F.qty + 'x)' : ''), 1], ['diff','Dif. p/ melhor', 1], ['free','Free days', 1]
    ];
    if(tt) cols.push(['tt','TT (dias)', 1]);
    cols.push(['until','Validade'], ['status','Status'], ['obs','Observações', 0, true], ['act','', 0, true]);
    var h = '<div class="twrap" id="twrap"><table><thead><tr>';
    cols.forEach(function(c){
      var sortable = !c[3];
      h += '<th class="' + (c[2] ? 'num ' : '') + (sortable ? 's' : '') + '"' + (sortable ? ' data-k="' + c[0] + '"' : '') + '>' + c[1] +
           (sortable ? '<span class="ar">' + (SORT.key === c[0] ? (SORT.dir > 0 ? '↑' : '↓') : '') + '</span>' : '') + '</th>';
    });
    h += '</tr></thead><tbody>';
    V.priced.forEach(function(r){
      var s = r.src, c = r.c, cls = 'r' + (r.isBest ? ' best' : '') + (r.val.k === 'expired' ? ' exp' : '');
      h += '<tr class="' + cls + '" data-id="' + r.id + '">' +
        '<td class="carr">' + carrierCell(s) + '</td><td>' + esc(s.agent) + '</td><td>' + esc(r.por) + '</td><td>' + esc(r.pod) + '</td>' +
        '<td class="num">' + money(c.freight) + '</td>' +
        '<td class="num">' + mblCell(s.mbl) + '</td>' +
        '<td class="num">' + (s.sur.ens != null ? money(s.sur.ens) : '<span class="dim">—</span>') + '</td>' +
        '<td class="num">' + (s.sur.isps != null ? money(s.sur.isps) : '<span class="dim">—</span>') + '</td>' +
        '<td class="num tot">' + money(c.total) + '</td>' +
        '<td class="num">' + (r.isBest ? '<span class="tag best">melhor</span>' : (r.diff == null ? '<span class="dim">—</span>' : (r.diff > 0 ? '+' : '') + money(r.diff) + ' <span class="dim">' + pct(r.diffPct) + '</span>')) + '</td>' +
        '<td class="num">' + (s.free.v != null ? s.free.v : '<span class="dim">' + (s.free.kind === 'tbc' ? 'TBC' : '—') + '</span>') + '</td>' +
        (tt ? '<td class="num">' + (s.tt.v != null ? s.tt.v : '<span class="dim">—</span>') + '</td>' : '') +
        '<td class="num">' + esc(validityText(s)) + '</td>' +
        '<td><span class="st ' + r.val.k + '">' + r.val.label + '</span></td>' +
        '<td class="obs">' + surChips(s) + '</td>' +
        '<td><div class="act"><button class="ib" type="button" data-copy="' + r.id + '" title="Copiar como texto de cotação">' + ICON.copy + '</button>' +
          '<a class="ib" href="' + esc(scheduleUrl(r)) + '" target="_blank" rel="noopener" title="Schedule ' + esc(s.carrierShort) + '">' + ICON.cal + '</a></div></td>' +
        '</tr>';
      if(OPEN[r.id]) h += detailRow(r, cols.length);
    });
    h += '</tbody></table></div>';
    res.innerHTML = h;
  }

  /* Sob consulta (TBC ou sem frete para o container escolhido), sempre no fim. */
  var ta = document.getElementById('tbcArea');
  if(F.priced || !V.tbc.length){ ta.innerHTML = ''; }
  else {
    var t = '<h2>Sob consulta <span class="c">' + V.tbc.length + '</span></h2><div class="twrap" style="max-height:none"><table class="tbc"><thead><tr>' +
      '<th>Carrier</th><th>Agente</th><th>POR</th><th>POD</th><th class="num">Frete 20\'</th><th class="num">Frete 40\'HC</th><th class="num">Free days</th><th class="num">Validade</th><th>Status</th><th>Observações</th></tr></thead><tbody>';
    V.tbc.forEach(function(r){
      var s = r.src;
      t += '<tr><td class="carr">' + carrierCell(s) + '</td><td>' + esc(s.agent) + '</td><td>' + esc(r.por) + '</td><td>' + esc(r.pod) + '</td>' +
        '<td class="num">' + fTxt(s.f20) + '</td><td class="num">' + fTxt(s.f40) + '</td>' +
        '<td class="num">' + (s.free.v != null ? s.free.v : '—') + '</td><td class="num">' + esc(validityText(s)) + '</td>' +
        '<td><span class="st ' + r.val.k + '">' + r.val.label + '</span></td><td class="obs">' + surChips(s) + (s.remarks && s.sur.status !== 'none' && s.sur.status !== 'partial' ? '' : '') + '</td></tr>';
    });
    ta.innerHTML = t + '</tbody></table></div>';
  }
  fitTable();
  updateFilterCount();
}
function fTxt(f){ return f.kind === 'num' ? money(f.v) : f.kind === 'tbc' ? 'TBC' : f.kind === 'invalid' ? esc(txt(f.raw)) : '—'; }

function detailRow(r, n){
  var s = r.src, x = s.sur, other = F.ct === '20' ? s.f40 : s.f20;
  var kv = [
    ['POL', s.polRaw ? r.pol : '—'],
    ['Linha da planilha', 'aba ' + s.sheet + ', linha ' + s.row + (s.porList.length * s.podList.length > 1 ? ' (gera ' + s.porList.length * s.podList.length + ' combinações POR x POD)' : '')],
    ['Frete ' + ctLabel(F.ct === '20' ? '40' : '20'), fTxt(other)],
    ['Cálculo do total', F.qty + ' x ' + money(r.c.freight) + ' + MBL ' + money(r.c.mbl) + ' + ENS ' + money(r.c.ens) + ' + ' + F.qty + ' x ISPS ' + money(r.c.isps) + ' = ' + money(r.c.total)],
    ['OWS', x.ows ? esc(owsText(x.ows)) + ' (fora do total)' : '—'],
    ['Cancelamento / alteração', (x.cancel != null ? money(x.cancel) + ' por cntr' : '—') + ' / ' + (x.amend != null ? money(x.amend) + ' por cntr' : '—')],
    ['Remarks (texto original)', esc(s.remarks) || '—'],
    ['Cancellation fee (texto original)', esc(s.cancelRaw) || '—']
  ];
  if(s.mbl.rounded) kv.push(['MBL original', esc(String(s.mbl.orig).replace('.', ',')) + ' (arredondado)']);
  if(x.issues.length) kv.push(['Não interpretado', esc(x.issues.join('; '))]);
  var med = r['out' + F.ct];
  if(med) kv.push(['Outlier', 'frete acima de ' + NF1.format(CONFIG.OUTLIER_FACTOR) + 'x a mediana da rota (' + money(med) + ')']);
  return '<tr class="det"><td colspan="' + n + '"><dl class="kv">' + kv.map(function(p){ return '<div><dt>' + p[0] + '</dt><dd>' + p[1] + '</dd></div>'; }).join('') + '</dl></td></tr>';
}

function scheduleUrl(r){
  var s = r.src, url = '#';
  for(var i = 0; i < SCHEDULE.length; i++) if(SCHEDULE[i][0].test(s.carrier)){ url = SCHEDULE[i][1]; break; }
  if(/MAERSK|\bMSK\b/.test(s.carrier)){
    var op = MSK_PORTS[r.por], dp = MSK_PORTS[r.pod];
    if(op && dp){
      var t = new Date(), d1 = t.toISOString().slice(0,10), d2_ = new Date(t.getTime() + 28*864e5).toISOString().slice(0,10);
      url = 'https://www.maersk.com/schedules/pointToPoint?from=' + op.geo + '&to=' + dp.geo + '&fromRkstCode=' + op.rkst + '&toRkstCode=' + dp.rkst +
        '&containerIsoCode=' + (F.ct === '20' ? '22G1' : '45G1') + '&fromServiceMode=CY&toServiceMode=CY&numberOfWeeks=4&dateType=D&date=' + d1 + '&dateTo=' + d2_ + '&vesselFlag=';
    }
  }
  return url;
}

/* Altura da tabela: ocupa a tela abaixo dos filtros, com cabeçalho fixo. */
function fitTable(){
  var w = document.getElementById('twrap');
  if(!w) return;
  var top = w.getBoundingClientRect().top + window.scrollY;
  document.documentElement.style.setProperty('--twh', Math.max(320, window.innerHeight - top - 12) + 'px');
}

/* =========================================================================
   MULTI-SELECT COM BUSCA
   ========================================================================= */
function MultiSelect(el, label, key){
  this.el = el; this.key = key; this.opts = []; this.q = '';
  el.innerHTML = '<span class="flbl">' + label + '</span><button type="button" class="ms-btn">' +
    '<span class="v">Todos</span>' + ICON.chev + '</button>' +
    '<div class="ms-pop" hidden><input class="ms-q" type="text" placeholder="Digite para filtrar" autocomplete="off">' +
    '<div class="ms-list"></div><div class="ms-foot"><span class="cnt"></span><button type="button" class="lnk ms-clear">Limpar</button></div></div>';
  var self = this, btn = el.querySelector('.ms-btn'), pop = el.querySelector('.ms-pop'), q = el.querySelector('.ms-q');
  this.btn = btn; this.pop = pop; this.qi = q; this.list = el.querySelector('.ms-list');
  btn.addEventListener('click', function(e){ e.stopPropagation(); var open = pop.hidden; MultiSelect.closeAll(); if(open){ pop.hidden = false; q.value = ''; self.q = ''; self.draw(); q.focus(); } });
  pop.addEventListener('click', function(e){ e.stopPropagation(); });
  q.addEventListener('input', function(){ self.q = q.value; self.draw(); });
  q.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ var f = self.list.querySelector('.ms-opt'); if(f) self.toggle(f.getAttribute('data-v')); e.preventDefault(); }
    if(e.key === 'Escape'){ MultiSelect.closeAll(); btn.focus(); }
  });
  this.list.addEventListener('click', function(e){ var o = e.target.closest('.ms-opt'); if(o) self.toggle(o.getAttribute('data-v')); });
  el.querySelector('.ms-clear').addEventListener('click', function(){ F[key] = []; self.draw(); self.label(); render(); });
  MultiSelect.all.push(this);
}
MultiSelect.all = [];
MultiSelect.closeAll = function(){ MultiSelect.all.forEach(function(m){ m.pop.hidden = true; }); };
MultiSelect.prototype.setOptions = function(opts){ this.opts = opts; F[this.key] = F[this.key].filter(function(v){ return opts.some(function(o){ return o.v === v; }); }); this.label(); };
MultiSelect.prototype.toggle = function(v){
  var sel = F[this.key], i = sel.indexOf(v);
  if(i >= 0) sel.splice(i, 1); else sel.push(v);
  this.draw(); this.label(); render();
};
MultiSelect.prototype.draw = function(){
  var sel = F[this.key], q = noAccent(this.q).toUpperCase().trim();
  var vis = this.opts.filter(function(o){ return !q || noAccent(o.t).toUpperCase().indexOf(q) >= 0; });
  this.list.innerHTML = vis.length ? vis.map(function(o){
    return '<div class="ms-opt" data-v="' + esc(o.v) + '"><input type="checkbox" tabindex="-1"' + (sel.indexOf(o.v) >= 0 ? ' checked' : '') + '>' + esc(o.t) + '<span class="n">' + o.n + '</span></div>';
  }).join('') : '<div class="ms-empty">Nada encontrado</div>';
  this.el.querySelector('.cnt').textContent = sel.length ? sel.length + ' selecionado' + (sel.length > 1 ? 's' : '') : '';
};
MultiSelect.prototype.label = function(){
  var sel = F[this.key], v = this.btn.querySelector('.v'), opts = this.opts;
  var names = sel.map(function(x){ var o = opts.filter(function(o){ return o.v === x; })[0]; return o ? o.t : x; });
  v.textContent = !sel.length ? 'Todos' : sel.length <= 2 ? names.join(', ') : sel.length + ' selecionados';
  v.className = 'v' + (sel.length ? ' on' : '');
  v.title = names.join(', ');
};
document.addEventListener('click', MultiSelect.closeAll);

/* Opções dos filtros com contagem de linhas (portos já normalizados: aparecem uma vez só). */
function buildOptions(){
  function count(getter){
    var m = {};
    DB.rows.forEach(function(r){ var k = getter(r); if(!k) return; if(!m[k[0]]) m[k[0]] = {v:k[0], t:k[1], n:0}; m[k[0]].n++; });
    return Object.keys(m).map(function(k){ return m[k]; }).sort(function(a,b){ return cmp(a.t, b.t); });
  }
  MS.por.setOptions(count(function(r){ return [r.por, r.por]; }));
  MS.pod.setOptions(count(function(r){ return [r.pod, r.pod]; }));
  MS.car.setOptions(count(function(r){ return r.src.carrier ? [r.src.carrier, r.src.carrierShort] : null; }));
  MS.ag.setOptions(count(function(r){ return r.src.agent ? [r.src.agent, r.src.agent] : null; }));
}

/* =========================================================================
   EXPORTAÇÃO: CSV e texto de cotação
   ========================================================================= */
function exportCsv(){
  var head = ['Carrier','Agente','POR','POL','POD','Container','Qtd','Frete','MBL','ENS','ISPS','Total','Dif. melhor USD','Dif. melhor %','Free days'];
  if(DB.hasTT) head.push('Transit time');
  head = head.concat(['Valido de','Valido ate','Status','OWS','Cancelamento','Alteracao','Remarks','Cancellation fee','Aba','Linha']);
  function n(v){ return v == null ? '' : String(Math.round(v * 100) / 100).replace('.', ','); }
  function line(r, priced){
    var s = r.src, c = r.c || {};
    var a = [s.carrierShort, s.agent, r.por, r.pol, r.pod, ctLabel(F.ct), F.qty,
      priced ? n(c.freight) : fTxt(s['f' + F.ct]),
      s.mbl.kind === 'incl' ? 'incluso' : n(s.mbl.v), n(s.sur.ens), n(s.sur.isps), priced ? n(c.total) : '',
      priced && !r.isBest ? n(r.diff) : (priced ? '0' : ''), priced && r.diffPct != null ? n(r.diffPct) : '', s.free.v == null ? '' : s.free.v];
    if(DB.hasTT) a.push(s.tt.v == null ? '' : s.tt.v);
    return a.concat([fmtDateCell(s.from), fmtDateCell(s.until), r.val.label, s.sur.ows ? owsText(s.sur.ows) : '', n(s.sur.cancel), n(s.sur.amend), s.remarks, s.cancelRaw, s.sheet, s.row]);
  }
  var rows = VIEW.priced.map(function(r){ return line(r, true); });
  if(!F.priced) rows = rows.concat(VIEW.tbc.map(function(r){ return line(r, false); }));
  var csv = [head].concat(rows).map(function(a){ return a.map(function(v){ v = v == null ? '' : String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }).join(';'); }).join('\r\n');
  var blob = new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a'), t = today();
  a.href = URL.createObjectURL(blob);
  a.download = 'tarifas_' + t.getFullYear() + '-' + ('0'+(t.getMonth()+1)).slice(-2) + '-' + ('0'+t.getDate()).slice(-2) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}

function quoteText(r){
  var s = r.src, L = [];
  L.push('Rota: ' + r.por + ' → ' + r.pod);
  L.push('Carrier: ' + s.carrierShort + ' | Agente: ' + s.agent);
  L.push('Frete ' + ctLabel(F.ct) + ': USD ' + money(r.c.freight) + ' por container');
  L.push('MBL: ' + (s.mbl.kind === 'incl' ? 'incluso' : s.mbl.kind === 'num' ? 'USD ' + money(s.mbl.v) + ' por BL' : s.mbl.kind === 'tbc' ? 'a confirmar' : '—'));
  L.push('Validade: ' + (s.from.kind === 'spot' && s.until.kind === 'spot' ? 'SPOT' : (fmtDateCell(s.from) || '—') + ' a ' + (fmtDateCell(s.until) || '—')));
  L.push('Free days (destino): ' + (s.free.v != null ? s.free.v + ' dias' : '—'));
  var rem = [s.remarks, s.cancelRaw ? 'Cancellation fee: ' + s.cancelRaw : ''].filter(Boolean).join(' | ');
  if(rem) L.push('Remarks: ' + rem);
  return L.join('\n');
}
function copyText(t){
  function ok(){ toast('Cotação copiada'); }
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(ok, fallback); else fallback();
  function fallback(){
    var ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); ok(); }catch(e){ toast('Não foi possível copiar'); }
    ta.remove();
  }
}
var toastT;
function toast(m){
  var el = document.querySelector('.toast') || document.body.appendChild(Object.assign(document.createElement('div'), {className:'toast'}));
  el.textContent = m; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(function(){ el.hidden = true; }, 1600);
}

/* =========================================================================
   PAINEL DE QUALIDADE DOS DADOS
   ========================================================================= */
function renderQuality(){
  var Q = DB.Q, srcs = DB.srcs;
  var withRate = srcs.filter(function(s){ return s.f20.kind === 'num' || s.f40.kind === 'num'; }).length;
  var tbcRows = srcs.filter(function(s){ return s.f20.kind !== 'num' && s.f40.kind !== 'num'; }).length;
  var partial = srcs.filter(function(s){ return (s.f20.kind === 'num') !== (s.f40.kind === 'num'); }).length;
  var alerts = Q.issues.length + Q.remarksBad.length + Q.outliers.length + Q.rounded.length;
  document.getElementById('dq').hidden = false;
  document.getElementById('dqSum').textContent = '· ' + plural(alerts, 'alerta');

  function stat(v, l){ return '<div><b>' + v + '</b><span>' + l + '</span></div>'; }
  function ref(s){ return s.sheet + ' L' + s.row; }
  function block(title, items, head, rowFn){
    var h = '<h3>' + title + ' <span class="c">' + items.length + '</span></h3>';
    if(!items.length) return h + '<div class="none">Nenhum.</div>';
    return h + '<table><thead><tr>' + head.map(function(x){ return '<th' + (/^Frete|Mediana/.test(x) ? ' class="num"' : '') + '>' + x + '</th>'; }).join('') + '</tr></thead><tbody>' + items.map(rowFn).join('') + '</tbody></table>';
  }
  var h = '<div class="stats">' +
    stat(Q.rawRows, 'linhas na planilha') + stat(Q.dupes.length, 'duplicadas removidas') + stat(srcs.length, 'linhas únicas') +
    stat(withRate, 'com tarifa') + stat(tbcRows, 'TBC / sem frete') + stat(partial, 'só um container com frete') +
    stat(DB.rows.length, 'combinações POR x POD') + stat(Q.remarksBad.length, 'remarks não interpretadas') + stat(Q.outliers.length, 'outliers') + '</div>';
  h += '<div class="none">Abas lidas: ' + esc(Q.sheets.join(', ')) + ' · fonte: ' + esc(SOURCE) + '</div>';

  h += block('Linhas não interpretadas', Q.issues, ['Linha','Carrier','Agente','POR','POD','Problema'], function(i){
    return '<tr><td>' + ref(i.s) + '</td><td>' + esc(i.s.carrierShort) + '</td><td>' + esc(i.s.agent) + '</td><td>' + esc(i.s.porList.join(' / ')) + '</td><td>' + esc(i.s.podList.join(' / ')) + '</td><td>' + esc(i.list.join('; ')) + '</td></tr>';
  });
  h += block('Outliers (frete acima de ' + NF1.format(CONFIG.OUTLIER_FACTOR) + 'x a mediana da rota e container)', Q.outliers, ['Linha','Carrier','Agente','Container','Frete','Mediana','Rotas'], function(o){
    var meds = o.routes.map(function(x){ return x.med; }), mn = Math.min.apply(null, meds), mx = Math.max.apply(null, meds);
    return '<tr><td>' + ref(o.s) + '</td><td>' + esc(o.s.carrierShort) + '</td><td>' + esc(o.s.agent) + '</td><td>' + ctLabel(o.ct) + '</td><td class="num">' + money(o.v) + '</td><td class="num">' + money(mn) + (mx !== mn ? '–' + money(mx) : '') + '</td><td>' +
      esc(o.routes.map(function(x){ return x.por + '→' + x.pod; }).join(', ')) + '</td></tr>';
  });
  h += block('Remarks não interpretadas (total ou parcialmente)', Q.remarksBad, ['Linha','Carrier','Agente','Texto','Problema'], function(s){
    return '<tr><td>' + ref(s) + '</td><td>' + esc(s.carrierShort) + '</td><td>' + esc(s.agent) + '</td><td>' + esc([s.remarks, s.cancelRaw].filter(Boolean).join(' | ')) + '</td><td>' + esc(s.sur.status === 'none' ? 'nenhuma taxa reconhecida' : s.sur.issues.join('; ')) + '</td></tr>';
  });
  h += block('MBL arredondado', Q.rounded, ['Linha','Carrier','Agente','Original','Usado'], function(s){
    return '<tr><td>' + ref(s) + '</td><td>' + esc(s.carrierShort) + '</td><td>' + esc(s.agent) + '</td><td>' + esc(String(s.mbl.orig).replace('.', ',')) + '</td><td>' + money(s.mbl.v) + '</td></tr>';
  });
  h += block('Duplicadas removidas', Q.dupes, ['Linha removida','Igual à'], function(d){ return '<tr><td>' + esc(d.sheet) + ' L' + d.row + '</td><td>' + esc(d.of.replace(' ', ' L')) + '</td></tr>'; });
  document.getElementById('dqBody').innerHTML = h;
}

/* =========================================================================
   CARREGAMENTO E EVENTOS
   ========================================================================= */
var MS = {};

function setHeader(){
  var info = document.getElementById('hdrInfo');
  info.innerHTML = (DB.updated ? '<span>Base atualizada em <b>' + d2(DB.updated) + '</b></span>' : '<span>Data de atualização não encontrada na planilha</span>') +
    '<span>' + esc(SOURCE) + '</span>';
}

function loadBuffer(buf, label){
  try{ loadWorkbook(XLSX.read(buf, {type:'array', cellDates:false}), label); }
  catch(e){ showLoadError('Não foi possível ler a planilha: ' + e.message); }
}

/* Monta um "workbook" a partir da base embutida (EMBED) e segue o mesmo caminho do .xlsx. */
function loadEmbedded(){
  var ws = XLSX.utils.aoa_to_sheet(EMBED.rows);
  ws['!merges'] = EMBED.merges || [];
  var wb = {SheetNames:[EMBED.sheet], Sheets:{}};
  wb.Sheets[EMBED.sheet] = ws;
  loadWorkbook(wb, EMBED.file + ' (embutida)');
}

function loadWorkbook(wb, label){
  try{
    var db = processWorkbook(wb);
    if(!db.srcs.length) throw new Error('Nenhuma aba com o cabeçalho esperado (CARRIER, AGENTE, POR, POD, FREIGHT...).');
    DB = db; SOURCE = label; OPEN = {};
    document.getElementById('fTTwrap').hidden = !DB.hasTT;
    if(!DB.hasTT) F.ttMax = null;
    setHeader(); buildOptions(); renderQuality(); render(); probeLogos();
  }catch(e){
    showLoadError('Não foi possível ler a planilha: ' + e.message);
  }
}

function showLoadError(msg){
  document.getElementById('hdrInfo').innerHTML = '<span>Base não carregada</span>';
  document.getElementById('results').innerHTML = '<div class="msg drop" id="dropZone">' + esc(msg) +
    '<br>Arraste a planilha para cá ou <button class="btn" type="button" onclick="document.getElementById(\'fileIn\').click()">Abrir planilha</button></div>';
  bindDrop(document.getElementById('dropZone'));
}

function bindDrop(el){
  if(!el) return;
  ['dragenter','dragover'].forEach(function(t){ el.addEventListener(t, function(e){ e.preventDefault(); el.classList.add('over'); }); });
  ['dragleave','drop'].forEach(function(t){ el.addEventListener(t, function(e){ e.preventDefault(); el.classList.remove('over'); }); });
  el.addEventListener('drop', function(e){ var f = e.dataTransfer.files[0]; if(f) readFile(f); });
}
function readFile(f){
  var rd = new FileReader();
  rd.onload = function(){ loadBuffer(new Uint8Array(rd.result), f.name + ' (arquivo local)'); };
  rd.readAsArrayBuffer(f);
}

function updateFilterCount(){
  var n = F.por.length + F.pod.length + F.car.length + F.ag.length + (F.ship ? 1 : 0) + (F.freeMin != null ? 1 : 0) + (F.ttMax != null ? 1 : 0) + (F.ct !== '20' ? 1 : 0) + (F.qty !== 1 ? 1 : 0) + (!F.priced ? 1 : 0) + (F.expired ? 1 : 0);
  document.getElementById('fCount').textContent = n ? ' (' + n + ')' : '';
}

function numOrNull(v){ v = txt(v); if(v === '') return null; var n = parseInt(v, 10); return isNaN(n) ? null : n; }

function init(){
  if(typeof XLSX === 'undefined'){ showLoadError('A biblioteca de leitura de Excel não carregou (sem internet?).'); return; }
  MS.por = new MultiSelect(document.getElementById('msPor'), 'Origem (POR)', 'por');
  MS.pod = new MultiSelect(document.getElementById('msPod'), 'Destino (POD)', 'pod');
  MS.car = new MultiSelect(document.getElementById('msCar'), 'Carrier', 'car');
  MS.ag = new MultiSelect(document.getElementById('msAg'), 'Agente', 'ag');

  document.querySelectorAll('.seg button').forEach(function(b){
    b.addEventListener('click', function(){
      F.ct = b.getAttribute('data-ct');
      document.querySelectorAll('.seg button').forEach(function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      render();
    });
  });
  document.getElementById('fQty').addEventListener('input', function(){ var n = numOrNull(this.value); F.qty = n && n > 0 ? n : 1; render(); });
  document.getElementById('fShip').addEventListener('change', function(){ F.ship = this.value ? parseDate(this.value).d : null; render(); });
  document.getElementById('fFree').addEventListener('input', function(){ F.freeMin = numOrNull(this.value); render(); });
  document.getElementById('fTT').addEventListener('input', function(){ F.ttMax = numOrNull(this.value); render(); });
  document.getElementById('fPriced').addEventListener('change', function(){ F.priced = this.checked; render(); });
  document.getElementById('fExpired').addEventListener('change', function(){ F.expired = this.checked; render(); });
  document.getElementById('fClear').addEventListener('click', function(){
    F.por = []; F.pod = []; F.car = []; F.ag = []; F.ship = null; F.freeMin = null; F.ttMax = null; F.qty = 1; F.ct = '20'; F.priced = true; F.expired = false;
    ['fShip','fFree','fTT'].forEach(function(id){ document.getElementById(id).value = ''; });
    document.getElementById('fQty').value = 1; document.getElementById('fPriced').checked = true; document.getElementById('fExpired').checked = false;
    document.querySelectorAll('.seg button').forEach(function(x){ x.setAttribute('aria-pressed', x.getAttribute('data-ct') === '20' ? 'true' : 'false'); });
    Object.keys(MS).forEach(function(k){ MS[k].label(); });
    render();
  });
  document.getElementById('btnFilters').addEventListener('click', function(){ document.getElementById('fbar').classList.toggle('open'); fitTable(); });
  document.getElementById('btnLoad').addEventListener('click', function(){ document.getElementById('fileIn').click(); });
  document.getElementById('fileIn').addEventListener('change', function(){ if(this.files[0]) readFile(this.files[0]); this.value = ''; });
  document.getElementById('btnCsv').addEventListener('click', exportCsv);

  /* Clique na tabela: ordenar, copiar, ou abrir o detalhe da linha. */
  document.getElementById('results').addEventListener('click', function(e){
    var th = e.target.closest('th[data-k]');
    if(th){ var k = th.getAttribute('data-k'); SORT = {key:k, dir: SORT.key === k ? -SORT.dir : 1}; render(); return; }
    var cp = e.target.closest('[data-copy]');
    if(cp){ var id = +cp.getAttribute('data-copy'); var r = VIEW.priced.filter(function(x){ return x.id === id; })[0]; if(r) copyText(quoteText(r)); return; }
    if(e.target.closest('a')) return;
    var tr = e.target.closest('tr.r');
    if(tr){ var i = tr.getAttribute('data-id'); OPEN[i] = !OPEN[i]; var y = document.getElementById('twrap').scrollTop; render(); var w = document.getElementById('twrap'); if(w) w.scrollTop = y; }
  });
  window.addEventListener('resize', fitTable);

  /* 1º tarifas.xlsx publicado no repositório (se houver); senão, a base embutida.
     ?v= evita cache antigo depois de atualizar o arquivo. */
  fetch(CONFIG.BASE_URL + '?v=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(function(buf){ loadBuffer(new Uint8Array(buf), CONFIG.BASE_URL); })
    .catch(function(){
      if(window.EMBED) loadEmbedded();
      else showLoadError('Não encontrei o arquivo ' + CONFIG.BASE_URL + ' ao lado desta página.');
    });
}

/* Só inicia depois da senha (a tela de senha substitui a página e recarrega). */
if(sessionStorage.getItem('fra') === '1'){
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
}
