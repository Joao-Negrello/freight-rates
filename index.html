body{font-family:'Segoe UI',system-ui,sans-serif;background:#f4f6f9;min-height:100vh;color:#1a1a2e}
.header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);padding:20px 28px;color:white;display:flex;align-items:center;gap:16px}

.field label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:#6b7280}
.field input,.field select{border:1.5px solid #e5e7eb;border-radius:8px;padding:8px 11px;font-size:13px;color:#1a1a2e;background:white;outline:none;transition:border .15s}
.field input:focus,.field select:focus{border-color:#0f3460}
.btn{background:#0f3460;color:white;border:none;border-radius:8px;padding:9px 22px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;align-self:flex-end;transition:background .15s}
.btn:hover{background:#1a1a2e}
.ac-wrap{position:relative}
.ac-drop{position:absolute;top:calc(100% + 4px);left:0;right:0;background:white;border:1.5px solid #e5e7eb;border-radius:8px;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.1);max-height:220px;overflow-y:auto}
.ac-item{padding:8px 12px;cursor:pointer;font-size:12px;border-bottom:1px solid #f3f4f6;color:#1a1a2e}
.ac-item:hover{background:#eff6ff}
.ac-item:last-child{border-bottom:none}
.main{padding:20px 28px}
.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.count{font-size:13px;color:#6b7280;font-weight:500}
.sort-btns{display:flex;gap:6px}
.sort-btn{padding:4px 11px;border-radius:20px;border:1.5px solid #e5e7eb;background:transparent;font-size:12px;cursor:pointer;color:#6b7280;transition:all .15s}
.sort-btn.active{background:#0f3460;border-color:#0f3460;color:white}
.cards{display:flex;flex-direction:column;gap:8px}
.card{background:white;border-radius:12px;border:1.5px solid #e5e7eb;overflow:hidden;transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}
.card.best{border-color:#16a34a}
.card-best-label{background:#f0fdf4;padding:3px 14px;font-size:11px;font-weight:700;color:#16a34a;border-bottom:1px solid #dcfce7}
.card-body{padding:13px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.card-left{flex:1;min-width:0}
.carrier-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.carrier-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.carrier-name{font-size:14px;font-weight:700}
.agent-badge{font-size:11px;background:#f3f4f6;padding:2px 8px;border-radius:99px;color:#555;font-weight:500}
.icd-badge{font-size:11px;background:#fef3c7;padding:2px 8px;border-radius:99px;color:#92400e;font-weight:600}
.route-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.route-port{font-size:11px;font-weight:600;color:#0f3460;background:#eff6ff;padding:3px 9px;border-radius:6px;border:1px solid #bfdbfe;max-width:260px;word-break:break-word}
.route-arrow{font-size:13px;color:#9ca3af;flex-shrink:0}
.badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.validity-badge{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500}
.valid{background:#f0fdf4;color:#16a34a}
.soon{background:#fffbeb;color:#d97706}
.expired{background:#fef2f2;color:#dc2626}
.dates{font-size:11px;color:#9ca3af}
.info-row{font-size:11px;color:#9ca3af;margin-top:3px}
.card-right{text-align:right;flex-shrink:0;min-width:140px}
.price-block{margin-bottom:4px}
.price-main{font-size:20px;font-weight:700;color:#1a1a2e;line-height:1.1}
.price-label{font-size:11px;color:#9ca3af;margin-top:1px}
.price-alt-block{margin-top:6px;padding-top:6px;border-top:1px solid #f3f4f6}
.price-alt-val{font-size:14px;font-weight:600;color:#6b7280}
.price-alt-label{font-size:11px;color:#c0c0c0}
.card-footer{padding:8px 16px 12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;border-top:1px solid #f3f4f6}
.remarks-toggle{background:none;border:none;cursor:pointer;font-size:11px;color:#9ca3af;padding:0;display:flex;align-items:center;gap:3px}
.remarks-box{margin:0 16px 10px;background:#f9fafb;border-radius:6px;padding:7px 10px;font-size:11px;color:#6b7280;line-height:1.5}
.schedule-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;border:1.5px solid;font-size:11px;font-weight:600;cursor:pointer;text-decoration:none;transition:opacity .15s;white-space:nowrap}

.ct-btn{padding:7px 13px;border:none;background:white;font-size:12px;font-weight:600;cursor:pointer;color:#6b7280;transition:all .15s}

const PORS=["CHENNAI", "COCHIN", "ENNORE", "HAZIRA", "ICD AHEMDABAD", "ICD AHMEDBAD", "ICD BANGLORE", "ICD DADRI", "ICD FARIDABAD", "ICD GARHI", "ICD GURGAON", "ICD HYDRABAD", "ICD JAIPUR", "ICD JODHPUR", "ICD KANPUR", "ICD KASHIPUR", "ICD LUDHIANA", "ICD MALANPUR", "ICD MANDIDEEP", "ICD MORADABAD", "ICD MORBI", "ICD NAGPUR", "ICD NEW DELHI", "ICD PALWAL", "ICD PANIPAT", "ICD PATLI", "ICD PITHAMPUR", "ICD SAMALKHA", "ICD SANAND", "ICD SONIPAT", "ICD TKD", "ICD TUGHLAKABAD", "KATTUPALI", "KATTUPALLI", "KOLKATA", "MUNDRA", "NHAVA SHEVA", "PIPAVAV", "TUTICORIN", "VISAKHAPATNAM", "VISHAKPATNAM"];
const PODS=["IMBITUBA", "ITAGUAI", "ITAJAI", "ITAPOA", "MANAUS", "NAVEGANTES", "PARANAGUA", "PECEM", "RIO DE JANEIRO", "RIO GRANDE", "SALVADOR", "SANTOS", "SUAPE", "VILA DO CONDE", "VITORIA"];
let container="20",sortBy="price";

function scheduleUrl(carrier,por,pod){
  const orig=por.split('/')[0].trim().toUpperCase();
  const dest=pod.split('/')[0].trim().toUpperCase();
  const oCode=PC[orig]||'';
  const dCode=PC[dest]||'';
  switch(carrier){
    case 'MSK - MAERSK':
      return oCode&&dCode
        ? `https://www.maersk.com/schedules/pointToPoint?searchType=PORT&origin=${oCode}&destination=${dCode}`
        : 'https://www.maersk.com/schedules/pointToPoint';
    case 'MSC': return 'https://www.msc.com/en/search-a-schedule';
    case 'CMA-CGM': return 'https://www.cma-cgm.com/';
    case 'HAPAG': return 'https://www.hapag-lloyd.com/solutions/schedule/#/';
    case 'EMC - EVERGREEN': return 'https://ss.shipmentlink.com/tvs2/jsp/TVS2_InteractiveSchedule.jsp';
    case 'HMM - HYUNDAI': return 'https://www.hmm21.com/e-service/general/schedule/ScheduleMain.do';
    default: return '#';
  }
}

function splitPorts(s){return s.split(/[\/,]/).map(p=>p.trim().toUpperCase()).filter(Boolean);}
function acFilter(field,q){
  const opts=field==="por"?PORS:PODS;
  const drop=document.getElementById(field+"-drop");
  const filtered=opts.filter(o=>o.toUpperCase().includes(q.toUpperCase())).slice(0,14);
  if(!filtered.length){drop.style.display="none";return;}
  drop.innerHTML=filtered.map(o=>`<div class="ac-item" onmousedown="acSelect('${field}','${o.replace(/'/g,"\'")}')">${o}</div>`).join("");
  drop.style.display="block";
}
function acOpen(field){acFilter(field,document.getElementById(field+"-input").value||"");}
function acSelect(field,val){document.getElementById(field+"-input").value=val;document.getElementById(field+"-drop").style.display="none";}
document.addEventListener("click",e=>{
  if(!e.target.closest("#ac-por")) document.getElementById("por-drop").style.display="none";
  if(!e.target.closest("#ac-pod")) document.getElementById("pod-drop").style.display="none";
});
function setContainer(ct,btn){container=ct;document.querySelectorAll(".ct-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");}
function setSort(s){sortBy=s;document.querySelectorAll(".sort-btn").forEach(b=>b.classList.remove("active"));document.querySelector(`[data-sort="${s}"]`).classList.add("active");search();}
function parseDate(s){if(!s)return null;const p=s.split("/");return p.length===3?new Date(+p[2],+p[1]-1,+p[0]):null;}
function vStatus(vu){const d=parseDate(vu);if(!d)return"valid";const n=new Date();if(d<n)return"expired";return(d-n)/86400000<=7?"soon":"valid";}
function fmtPrice(v){return v?'USD '+v.toLocaleString("pt-BR"):'—';}

function search(){
  const por=document.getElementById("por-input").value.trim().toUpperCase();
  const pod=document.getElementById("pod-input").value.trim().toUpperCase();
  const carrier=document.getElementById("carrier-sel").value;
  const agente=document.getElementById("agente-sel").value;

  let f=D.filter(r=>{
    if(por&&!splitPorts(r[2]).includes(por)) return false;
    if(pod&&!splitPorts(r[4]).includes(pod)) return false;
    if(carrier&&r[0]!==carrier) return false;
    if(agente&&r[1]!==agente) return false;
    return true;
  });

  if(sortBy==="price") f.sort((a,b)=>(container==="20"?(a[5]||99999):(a[6]||99999))-(container==="20"?(b[5]||99999):(b[6]||99999)));
  else f.sort((a,b)=>{const da=parseDate(a[10])||new Date(0);const db=parseDate(b[10])||new Date(0);return db-da;});

  const prices=f.map(r=>container==="20"?r[5]:r[6]).filter(Boolean);
  const lowest=prices.length?Math.min(...prices):null;
  const area=document.getElementById("results-area");
  if(!f.length){area.innerHTML=`<div class="empty">Nenhuma tarifa encontrada. Tente outros filtros.</div>`;return;}

  let html=`<div class="meta"><div class="count">${f.length} resultado${f.length!==1?"s":""} encontrado${f.length!==1?"s":""}</div><div class="sort-btns"><button class="sort-btn${sortBy==="price"?" active":""}" data-sort="price" onclick="setSort('price')">Menor preço</button><button class="sort-btn${sortBy==="validity"?" active":""}" data-sort="validity" onclick="setSort('validity')">Validade</button></div></div><div class="cards">`;

  f.forEach((r,i)=>{
    // r: [carrier,agente,por,pol,pod,f20,f40,mbl,free,vfrom,vuntil,remarks,sheet,inland20,inland40]
    const is20=container==="20";
    const pMain=is20?(r[5]||0):(r[6]||0);
    const pAlt=is20?(r[6]||0):(r[5]||0);
    const labelMain=is20?"20' GP":"40' HQ";
    const labelAlt=is20?"40' HQ":"20' GP";
    const isBest=lowest!==null&&pMain===lowest&&pMain>0;
    const vs=vStatus(r[10]);
    const vLabel=vs==="expired"?"Expirado":vs==="soon"?"Expira em breve":"Válido";
    const col=CC[r[0]]||"#888";
    const short=CS[r[0]]||r[0];
    const isICD=r[12]==="ICD";

    // FREE TIME (index 8), MBL (index 7)
    const freetime=String(r[8]||"").trim();
    const mblRaw=String(r[7]||"").replace(/USD\s*/i,"").trim();
    let mblText="";
    if(mblRaw&&mblRaw!=="INCLUDED"&&mblRaw!=="INCL"&&mblRaw!=="") mblText=` · MBL: USD ${mblRaw}`;
    else if(mblRaw==="INCLUDED"||mblRaw==="INCL") mblText=" · MBL: incluído";
    let inlandText="";
    if(r[13]&&r[13]!=="") inlandText=` · Inland 20': ${r[13]}`;
    if(r[14]&&r[14]!=="") inlandText+=` / 40': ${r[14]}`;
    const schUrl=scheduleUrl(r[0],r[2],r[4]);

    html+=`<div class="card${isBest?" best":""}">`;
    if(isBest) html+=`<div class="card-best-label">✓ Menor preço</div>`;
    html+=`<div class="card-body"><div class="card-left">`;
    html+=`<div class="carrier-row"><div class="carrier-dot" style="background:${col}"></div><span class="carrier-name">${short}</span><span class="agent-badge">${r[1]}</span>${isICD?'<span class="icd-badge">ICD</span>':''}</div>`;
    html+=`<div class="route-row"><span class="route-port">${r[2]}</span><span class="route-arrow">→</span><span class="route-port">${r[4]}</span></div>`;
    html+=`<div class="badges"><span class="validity-badge ${vs}">${vLabel}</span><span class="dates">${r[9]} → ${r[10]}</span></div>`;
    html+=`<div class="info-row">Free Time: ${freetime||"—"}${mblText}${inlandText}</div>`;
    html+=`</div>`;
    // Price block right
    html+=`<div class="card-right">`;
    html+=`<div class="price-block"><div class="price-main">${fmtPrice(pMain)}</div><div class="price-label">${labelMain}</div></div>`;
    if(pAlt) html+=`<div class="price-alt-block"><div class="price-alt-val">${fmtPrice(pAlt)}</div><div class="price-alt-label">${labelAlt}</div></div>`;
    html+=`</div></div>`;
    // Footer
    html+=`<div class="card-footer">`;
    html+=r[11]?`<button class="remarks-toggle" onclick="toggleRem(${i})"><span id="arr-${i}">▼</span> observações</button>`:`<span></span>`;
    html+=`<a href="${schUrl}" target="_blank" class="schedule-btn" style="color:${col};border-color:${col}">🗓 Schedule ${short}</a>`;
    html+=`</div>`;
    if(r[11]) html+=`<div class="remarks-box" id="rem-${i}" style="display:none">${r[11]}</div>`;
    html+=`</div>`;
  });
  html+=`</div>`;
  area.innerHTML=html;
}
function toggleRem(i){
  const box=document.getElementById("rem-"+i);
  const arr=document.getElementById("arr-"+i);
  box.style.display=box.style.display==="none"?"block":"none";
  arr.textContent=box.style.display==="none"?"▼":"▲";
}
</script>
</body>
</html>
